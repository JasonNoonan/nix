# herdr configuration — symlinked to ~/.config/herdr/config.toml by
# home/herdr/default.nix. Herdr's settings UI writes here too; commit changes.
# Reference: https://herdr.dev/docs/config-reference/
# Apply edits to a running server with `herdr server reload-config` (prefix+R).

onboarding = false

[theme]
# Follow Ghostty's palette, like Supacode's terminal theme sync.
name = "terminal"

[terminal]
# Login shells on macOS so Homebrew/mise PATH setup runs in new panes.
shell_mode = "auto"

[worktrees]
# Herdr/hwt create checkouts under <directory>/<repo>/<branch-slug>
# (Supacode used ~/.supacode/repos/<repo>/<branch>).
directory = "~/.herdr/worktrees"

[ui]
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
]
window_title = "{hostname}: {workspace}"

[ui.toast]
# Supacode: in-app notifications on, system notifications off,
# muted for the active surface (Herdr always suppresses the active tab).
delivery = "herdr"

[keys]
# Vim-oriented. `prefix+?` lists every active binding.
#
# ctrl+space instead of ctrl+b, which is page-up in vim and copy mode.
prefix = "ctrl+space"
# Worktrees go through hwt (see below) so they get the Supacode-style setup.
new_worktree = ""

# Direct (prefix-free) layer on ctrl+alt: free in Ghostty/macOS, doesn't touch
# nvim's ctrl+h/j/k/l split navigation. Avoid ctrl+alt+p/r (Ghostty keybinds).
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
resize_pane_left = "ctrl+alt+shift+h"
resize_pane_down = "ctrl+alt+shift+j"
resize_pane_up = "ctrl+alt+shift+k"
resize_pane_right = "ctrl+alt+shift+l"
# Jump back to the previous pane, like vim's ctrl+o / tmux's `;`.
last_pane = ["prefix+semicolon", "ctrl+alt+o"]
zoom = ["prefix+z", "ctrl+alt+z"]
# Tabs: [ / ] like vim's unimpaired-style motions.
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
switch_tab = ["prefix+1..9", "ctrl+alt+1..9"]
# Workspaces stack vertically in the sidebar: ctrl+u / ctrl+d like scrolling.
previous_workspace = "ctrl+alt+u"
next_workspace = "ctrl+alt+d"

# Prefix layer, mirroring vim's ctrl+w window commands.
split_vertical = "prefix+v"                     # :vsplit / ctrl+w v
split_horizontal = ["prefix+s", "prefix+minus"] # :split  / ctrl+w s
close_pane = ["prefix+q", "prefix+x"]           # :q      / ctrl+w q
detach = "prefix+d"                             # tmux-style, frees q
settings = "prefix+comma"                       # was prefix+s

# Project picker + tally layout ("open project").
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "hally"
description = "open project (tally layout)"
width = "80%"
height = "70%"

# Vellum command palette (palette: home/herdr/vellum/herdr-commands.toml).
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "vlm herdr-commands"
description = "command palette"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "vlm herdr-workspaces"
description = "find workspace"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "vlm herdr-worktrees"
description = "jump to worktree (branch/name/repo)"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "pane=\"$(vlm herdr-agents)\" && herdr agent focus \"$pane\""
description = "find agent"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "hwt.worktrees.new"
description = "new configured worktree (hwt)"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "hwt.worktrees.remove"
description = "remove current worktree (hwt)"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

[experimental]
kitty_graphics = true
